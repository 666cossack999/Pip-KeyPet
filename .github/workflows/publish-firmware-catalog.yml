name: Publish firmware catalog (Pages)

on:
  workflow_run:
    workflows:
      - Build firmware, web flasher and release
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: firmware-catalog-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish stable + green PR previews
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted site publisher from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build static Pages catalog from verified CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/build_firmware_catalog.py --site docs
          python3 -m unittest discover -s tools/tests -p 'test_firmware_catalog.py'

      - name: Upload GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      # upload-pages-artifact can complete before the Actions artifacts API
      # makes its new entry visible to deploy-pages (seen in runs #26/#27).
      - name: Wait until Pages artifact is discoverable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || true)"
            if [[ "$count" =~ ^[0-9]+$ ]] && (( count > 0 )); then
              echo "Pages artifact visible via Actions API (attempt $attempt, matches $count)."
              exit 0
            fi
            echo "Pages artifact not yet visible (attempt $attempt/12); waiting 10 seconds..."
            sleep 10
          done
          echo "::error::github-pages artifact not visible through Actions API after 120 seconds; check Actions artifact access and status."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
