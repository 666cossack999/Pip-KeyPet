name: Delete merged PR branches

on:
  pull_request:
    types: [closed]
  # One-time historical cleanup on introducing this workflow.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only verified merged same-repository branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_pr() {
            local number="$1" details branch source_repo merged_sha head_sha current_sha
            details="$(gh api "repos/${GH_REPO}/pulls/${number}")"
            merged_sha="$(jq -r '.merge_commit_sha // ""' <<<"$details")"
            branch="$(jq -r '.head.ref // ""' <<<"$details")"
            head_sha="$(jq -r '.head.sha // ""' <<<"$details")"
            source_repo="$(jq -r '.head.repo.full_name // ""' <<<"$details")"

            if [[ "$(jq -r '.merged' <<<"$details")" != "true" || -z "$merged_sha" ]]; then
              echo "Skip PR #$number: not merged"
              return 0
            fi
            if [[ "$source_repo" != "$GH_REPO" ]]; then
              echo "Skip PR #$number: branch from another repository"
              return 0
            fi
            case "$branch" in
              ""|main|master|dev|develop|stage|prod)
                echo "Skip protected or long-lived branch '$branch'"
                return 0
                ;;
            esac

            current_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$current_sha" ]]; then
              echo "Branch '$branch' is already absent"
              return 0
            fi
            if [[ "$current_sha" != "$head_sha" ]]; then
              echo "Skip '$branch': source branch changed since PR #$number was merged"
              return 0
            fi

            echo "Deleting merged PR #$number branch '$branch' at $head_sha"
            gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
            echo "Deleted '$branch'"
          }

          if [[ "$EVENT_NAME" == "push" ]]; then
            # Exact historical PRs reviewed before this workflow was installed.
            cleanup_pr 1
            cleanup_pr 2
          else
            cleanup_pr "$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
          fi
